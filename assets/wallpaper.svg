<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <!-- Ionix default wallpaper. The mark is the one from ionix-logo.svg and the
       wordmark is JetBrains Mono Bold converted to outlines, so the render does not
       depend on which fonts the build container has. Palette: CLAUDE.md core roles
       plus the logo's own #c385ff -> #a0e6ff gradient. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0714"/>
      <stop offset="0.45" stop-color="#150d22"/>
      <stop offset="0.7" stop-color="#1a1025"/>
      <stop offset="1" stop-color="#0c0814"/>
    </linearGradient>
    <radialGradient id="bloom" cx="1920" cy="950" r="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.34"/>
      <stop offset="0.35" stop-color="#7c3aed" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="620" cy="1780" r="1150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#48dbfb" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#48dbfb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="3300" cy="330" r="1250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="1920" cy="1080.0" r="2400" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#05030a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05030a" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#48dbfb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#9b59b6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a855f7" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#9b59b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gem" gradientUnits="userSpaceOnUse" x1="150" y1="40" x2="362" y2="472">
      <stop offset="0" stop-color="#c385ff"/>
      <stop offset="1" stop-color="#a0e6ff"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2d9f3"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="spark" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Film grain: breaks up 8-bit banding in the long, dark gradients. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0 1  0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>
  <rect width="3840" height="2160" fill="url(#cyanGlow)"/>
  <rect width="3840" height="2160" fill="url(#violetGlow)"/>
  <rect width="3840" height="2160" fill="url(#bloom)"/>

