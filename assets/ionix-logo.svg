<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#9b59b6"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Outer hexagon -->
  <polygon points="256,40 452,148 452,364 256,472 60,364 60,148"
           fill="url(#logoGrad)" opacity="0.9"/>

  <!-- Inner hexagon -->
  <polygon points="256,100 400,180 400,340 256,420 112,340 112,180"
           fill="#0f0a18" opacity="0.95"/>

  <!-- Diamond accent -->
  <polygon points="256,160 320,256 256,352 192,256"
           fill="url(#innerGrad)" opacity="0.8"/>

  <!-- Center line -->
  <line x1="256" y1="180" x2="256" y2="332" stroke="#0f0a18" stroke-width="8"/>

  <!-- I text (representing Ionix) -->
  <text x="256" y="280" text-anchor="middle"
        font-family="sans-serif" font-size="80" font-weight="bold"
        fill="#e2d9f3">
    I
  </text>
</svg>
