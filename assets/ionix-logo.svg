<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ionix mark "Carved": the 2019 swirl-eye (i.png) redrawn as a tall diamond.
       Solid gem, dark pupil, and the swirl cut in as two point-symmetric slits.
       Generated geometry; outer diamond is 288 x 456 centred on 256,256. -->
  <defs>
    <linearGradient id="ionixGrad" gradientUnits="userSpaceOnUse" x1="150" y1="40" x2="362" y2="472">
      <stop offset="0" stop-color="#c385ff"/>
      <stop offset="1" stop-color="#a0e6ff"/>
    </linearGradient>
  </defs>

  <!-- Pupil -->
  <path d="M256.0,192.2L296.3,256.0L256.0,319.8L215.7,256.0Z" fill="#0f0a18"/>

  <!-- Gem body with slits (pupil punched out via evenodd) -->
  <path d="M256.0,28.0L202.7,112.4L224.0,176.7L224.0,176.7L173.9,256.0L221.5,331.4L213.7,348.6L155.2,256.0L198.5,187.4L192.6,128.3L112.0,256.0L256.0,484.0L309.3,399.6L288.0,335.3L288.0,335.3L338.1,256.0L290.5,180.6L298.3,163.4L356.8,256.0L313.5,324.6L319.4,383.7L400.0,256.0L256.0,28.0ZM256.0,192.2L296.3,256.0L256.0,319.8L215.7,256.0Z" fill="url(#ionixGrad)" fill-rule="evenodd"
        stroke="#0f0a18" stroke-width="4" stroke-linejoin="round"/>
