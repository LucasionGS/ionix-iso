LABEL ionix
TEXT HELP
Boot the Ionix live medium on BIOS.
It allows you to install Ionix or perform system maintenance.
ENDTEXT
MENU LABEL Ionix Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Accessibility boot option
LABEL ionixspeech
TEXT HELP
Boot the Ionix live medium on BIOS with speakup screen reader.
It allows you to install Ionix or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Ionix Live (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
