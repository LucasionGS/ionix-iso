---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    # options must be a list: a bare `bind` is iterated letter by letter into
    # `-o b,i,n,d`, the mount fails, and the target then has no /dev — which
    # nothing noticed until luksbootkeyfile needed to see the LUKS partition.
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    # cryptsetup in the target asks udev about the device.
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

mountOptions:
  - filesystem: default
    options: [ defaults, noatime ]
  - filesystem: btrfs
    options: [ defaults, noatime, compress=zstd:1, ssd, space_cache=v2 ]
  - filesystem: ext4
    options: [ defaults, noatime ]
  - filesystem: xfs
    options: [ defaults, noatime ]
  - filesystem: f2fs
    options: [ defaults, noatime ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
