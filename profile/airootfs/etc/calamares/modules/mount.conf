---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: bind
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /sys/firmware/efi/efivars
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars

mountOptions:
  - filesystem: default
    options: [ defaults, noatime ]
  - filesystem: btrfs
    options: [ defaults, noatime, compress=zstd:1, ssd, space_cache=v2 ]
  - filesystem: ext4
    options: [ defaults, noatime ]
  - filesystem: xfs
    options: [ defaults, noatime ]
  - filesystem: f2fs
    options: [ defaults, noatime ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
