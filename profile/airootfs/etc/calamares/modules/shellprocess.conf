---
dontChroot: true
timeout: 300
script:
  - command: "arch-chroot ${ROOT} /usr/local/bin/ionix-post-install"
    timeout: 120
  - command: "arch-chroot ${ROOT} grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=Ionix --force"
    timeout: 60
  - command: "arch-chroot ${ROOT} grub-mkconfig -o /boot/grub/grub.cfg"
    timeout: 60
  - command: "arch-chroot ${ROOT} /usr/local/bin/ionix-secureboot-sign"
    timeout: 90
