---
dontChroot: true
timeout: 300
# ${gs[...]} values come from Calamares' GlobalStorage. The ionix* keys are
# written by the Personalize and Software pages (branding/ionix/ionix-*.qml) as
# soon as those pages exist, because a command naming a key that is missing from
# GlobalStorage fails outright.
script:
  - command: "arch-chroot ${ROOT} env IONIX_THEME=${gs[ionixTheme]} IONIX_BAR=${gs[ionixBar]} IONIX_AUTOLOGIN=${gs[ionixAutologin]} /usr/local/bin/ionix-post-install"
    timeout: 120
  - command: "arch-chroot ${ROOT} grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=Ionix --force"
    timeout: 60
  - command: "mkdir -p ${ROOT}/boot/efi/EFI/BOOT && cp ${ROOT}/boot/efi/EFI/Ionix/grubx64.efi ${ROOT}/boot/efi/EFI/BOOT/BOOTX64.EFI"
    timeout: 10
  - command: "arch-chroot ${ROOT} grub-mkconfig -o /boot/grub/grub.cfg"
    timeout: 60
  # Optional software from the Software page, downloaded now (arch-chroot bind-
  # mounts the live resolv.conf, so the network works in there). It exits 0 even
  # when it cannot install something — that is recorded for a first-login
  # reminder rather than failing an install that is otherwise complete. The
  # generous timeout covers a full system upgrade plus Steam and Wine.
  - command: "arch-chroot ${ROOT} /usr/local/bin/ionix-extras install --during-install --user ${USER} ${gs[ionixExtras]}"
    timeout: 5400
