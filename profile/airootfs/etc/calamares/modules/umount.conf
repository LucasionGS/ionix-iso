---
# Last exec step: sync and unmount the target (and close its LUKS mapping).
# Without it the new system stays mounted after "All done" with its last writes
# still in the live session's page cache — power off there instead of pressing
# Restart and ext4 leaves files like /boot/grub/grub.cfg zero-length, which boots
# to a bare `grub>` prompt. emergency: also run it when an earlier step failed.
emergency: true
