---
# Writes HOOKS/MODULES/FILES in the target's /etc/mkinitcpio.conf, adding
# `encrypt` (and the keyfile from luksbootkeyfile) when root is on LUKS.
# ionix-post-install then deletes archiso's mkinitcpio.conf.d override and runs
# `mkinitcpio -P`, which is what actually builds the images.
#
# busybox hooks, not systemd ones: grubcfg writes `cryptdevice=` on the kernel
# command line, which only the busybox `encrypt` hook reads (`sd-encrypt` wants
# rd.luks.* instead).
#
# This file must exist even with nothing to change: without it Calamares uses its
# bundled example, which adds a hook literally named "bogus".
useSystemdHook: false
hooks:
    prepend: []
    append: []
    remove: []
source: "/etc/mkinitcpio.conf"
