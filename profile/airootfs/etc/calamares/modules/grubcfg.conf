---
# Edits the Ionix /etc/default/grub already on the target (theme, timeout, ...)
# rather than replacing it. When root is on LUKS it sets GRUB_ENABLE_CRYPTODISK=y
# — without which grub-install refuses to install to an encrypted disk — and adds
# cryptdevice= to the kernel command line.
overwrite: false
prefer_grub_d: false
keep_distributor: true
# Must repeat Ionix's own parameters (etc/default/grub): this list is what the
# command line is built from.
kernel_params: [ "quiet", "loglevel=3" ]
always_use_defaults: false
