---
modules-search: [ local, /usr/lib/calamares/modules ]

# The two Ionix pages are the generic notesqml module run twice, each with its own
# QML file from the branding directory.
instances:
  - id:     personalize
    module: notesqml
    config: ionix-personalize.conf
  - id:     software
    module: notesqml
    config: ionix-software.conf

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - notesqml@personalize
    - notesqml@software
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    # Disk encryption: keyfile, encrypted swap, then initramfs hooks. These do
    # nothing on an unencrypted install except initcpiocfg, which always writes
    # the HOOKS line.
    - luksbootkeyfile
    - luksopenswaphookcfg
    - initcpiocfg
    - networkcfg
    - hwclock
    - services-systemd
    - removeuser
    - users
    # Before shellprocess: grub-install there needs GRUB_ENABLE_CRYPTODISK set.
    - grubcfg
    - shellprocess
    # Always last: flushes and unmounts the target; see modules/umount.conf.
    - umount
  - show:
    - finished

branding: ionix
prompt-install: true
dont-chroot: false
