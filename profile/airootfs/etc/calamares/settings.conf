---
modules-search: [ local, /usr/lib/calamares/modules ]

# The two Ionix pages are the generic notesqml module run twice, each with its own
# QML file from the branding directory.
instances:
  - id:     personalize
    module: notesqml
    config: ionix-personalize.conf
  - id:     software
    module: notesqml
    config: ionix-software.conf

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - notesqml@personalize
    - notesqml@software
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - networkcfg
    - hwclock
    - services-systemd
    - removeuser
    - users
    - shellprocess
  - show:
    - finished

branding: ionix
prompt-install: true
dont-chroot: false
