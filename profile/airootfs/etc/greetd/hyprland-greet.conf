# Ionix Greeter - Hyprland Configuration
# This config is used ONLY for the greetd greeter session.
# It runs ReGreet inside a minimal Hyprland instance.

monitor = ,preferred,auto,1

input {
    kb_layout = us
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

general {
    col.active_border = rgb(9b59b6)
    col.inactive_border = rgb(2d2d3f)
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

# Wallpaper
exec-once = swww-daemon && swww img /usr/local/share/ionix/wallpaper.png --transition-type none

# Launch ReGreet, then exit Hyprland when done
exec-once = regreet; hyprctl dispatch exit
