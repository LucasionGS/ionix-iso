$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

# Fingerprint unlock. hyprlock drives fprintd over D-Bus itself rather than
# going through pam_fprintd, which is the whole reason this is on for everyone
# rather than gated on hardware like the PAM side is: password and finger race
# each other, so the text field never stops accepting typing.
#
# On a machine with no reader, GetDefaultDevice fails, hyprlock logs a warning
# and carries on with the password. These two messages only ever reach the
# screen once a scan has actually started, so nothing here promises a sensor
# that isn't there — see placeholder_text below, which appends $FPRINTPROMPT
# (empty until then) rather than replacing the password prompt with it.
auth {
    pam {
        enabled = true
    }

    fingerprint {
        enabled = true
        ready_message = <span foreground="##c084fc">  ·  󰈷 or scan your finger</span>
        present_message = <span foreground="##a855f7">  ·  󰈷 Scanning…</span>
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 6, easeOutExpo
    animation = fadeOut, 1, 6, easeOutExpo
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 5
    brightness = 0.65
    vibrancy = 0.15
    vibrancy_darkness = 0.3
}

input-field {
    monitor =
    size = 20%, 55
    outline_thickness = 2
    inner_color = rgba(15, 10, 24, 0.85)

    outer_color = rgba(155, 89, 182, 0.85) rgba(124, 58, 237, 0.85) 45deg
    check_color = rgba(46, 204, 113, 0.9) rgba(124, 58, 237, 0.9) 45deg
    fail_color = rgba(231, 76, 60, 0.9) rgba(155, 89, 182, 0.9) 120deg

    font_color = rgb(226, 217, 243)
    fade_on_empty = true
    rounding = 12

    font_family = $font
    placeholder_text = <span foreground="##a78bca"> Password...</span>$FPRINTPROMPT
    fail_text = <span foreground="##e74c3c">$PAMFAIL$FPRINTFAIL</span>

    dots_size = 0.3
    dots_spacing = 0.35
    dots_rounding = -1

    shadow_passes = 3
    shadow_boost = 1.2
    shadow_color = rgba(0, 0, 0, 0.6)

    position = 0, -20
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME12
    font_size = 96
    font_family = $font
    color = rgba(226, 217, 243, 0.95)

    shadow_passes = 3
    shadow_boost = 1.2
    shadow_color = rgba(0, 0, 0, 0.6)

    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"<b>%A</b>, %d %B %Y"
    font_size = 22
    font_family = $font
    color = rgba(192, 132, 252, 0.9)

    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, 115
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = <span foreground="##a78bca">Welcome back, </span><span foreground="##e2d9f3"><b>$USER</b></span>
    font_size = 15
    font_family = $font

    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, -85
    halign = center
    valign = center
}