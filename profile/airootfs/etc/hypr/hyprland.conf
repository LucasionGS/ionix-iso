# ╔══════════════════════════════════════════════════════════════╗
# ║  Ionix - System Hyprland Configuration                     ║
# ║  /etc/hypr/hyprland.conf                                   ║
# ║                                                            ║
# ║  User overrides: ~/.config/hypr/hyprland.conf              ║
# ║  This file provides sensible defaults. Users source this   ║
# ║  file and add overrides in their own config.               ║
# ╚══════════════════════════════════════════════════════════════╝


# ── Monitors ──────────────────────────────────────────────────
# Auto-detect and use preferred resolution
monitor = ,preferred,auto,1


# ── Input ─────────────────────────────────────────────────────
input {
    kb_layout = dk
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

binds {
    scroll_event_delay = 10
}


# ── Gestures ──────────────────────────────────────────────────
gesture = 2, pinch, resize
gesture = 4, down, close


# ── General ───────────────────────────────────────────────────
general {
    gaps_in = 2
    gaps_out = 2
    border_size = 2
    col.active_border = rgb(9b59b6) rgb(7c3aed) 45deg
    col.inactive_border = rgb(2d2d3f)
    layout = dwindle
    allow_tearing = true
}


# ── Decoration ────────────────────────────────────────────────
decoration {
    rounding = 12

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a2e88)
    }
}


# ── Animations ────────────────────────────────────────────────
animations {
    enabled = true

    bezier = ionixSmooth, 0.25, 0.1, 0.25, 1.0
    bezier = ionixSnap, 0.4, 0.0, 0.2, 1.0

    animation = windows, 1, 5, ionixSmooth, slide
    animation = windowsOut, 1, 5, ionixSmooth, popin 80%
    animation = fade, 1, 4, ionixSmooth
    animation = workspaces, 1, 5, ionixSnap, slidefade 50%
    animation = layers, 1, 3, ionixSmooth, fade
}


# ── Layouts ───────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
}


# ── Misc ──────────────────────────────────────────────────────
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    vrr = 1
}


# ── Environment ───────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = GTK_THEME,Adwaita:dark
env = QT_QPA_PLATFORMTHEME,qt5ct
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = CHROME_EXECUTABLE,/usr/bin/google-chrome-stable
env = ELECTRON_OZONE_PLATFORM_HINT,auto


# ══════════════════════════════════════════════════════════════
# ║  Key Bindings                                              ║
# ══════════════════════════════════════════════════════════════

$mainMod = SUPER

# ── Applications ──────────────────────────────────────────────
bind = $mainMod, T, exec, kitty
bind = Ctrl+Alt, T, exec, tabby
bind = $mainMod, W, exec, google-chrome-stable
bind = $mainMod, E, exec, nemo
bind = $mainMod, B, exec, kitty btop
bind = $mainMod, R, exec, pkill nwg-drawer || nwg-drawer
bind = Alt, Space, exec, ags request -i ionix-shell "command-palette"
bind = $mainMod, V, exec, copyq toggle
bind = $mainMod, L, exec, hyprlock -c /etc/hypr/hyprlock.conf --grace 2
bind = Ctrl+$mainMod, R, exec, hyprctl reload

# ── HyprPanel ─────────────────────────────────────────────────
bind = $mainMod, SUPER_L, exec, hyprpanel t dashboardmenu
bind = $mainMod, N, exec, hyprpanel t notificationsmenu

# ── Wallpaper ─────────────────────────────────────────────────
bind = Ctrl+$mainMod, W, exec, bash ~/.config/ionix/scripts/promptwallpaper.sh
bind = $mainMod+Alt, W, exec, bash ~/.config/ionix/cron/cycle-wallpaper.sh

# ── Window Management ─────────────────────────────────────────
bind = $mainMod, Q, killactive
bind = $mainMod, Space, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, D, fullscreen, 1
bind = $mainMod+Alt, F, fullscreenstate, 0 3
bind = $mainMod, P, pin

# ── Window Groups ─────────────────────────────────────────────
bind = $mainMod, G, togglegroup
bind = $mainMod+Shift, G, lockactivegroup, toggle
bind = $mainMod+Shift, mouse_up, changegroupactive, f
bind = $mainMod+Shift, mouse_down, changegroupactive, b
bind = $mainMod+Ctrl, Tab, changegroupactive, f
bind = $mainMod+Shift+Ctrl, Tab, changegroupactive, b

# ── Focus ─────────────────────────────────────────────────────
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d
bind = $mainMod, BracketLeft, movefocus, l
bind = $mainMod, BracketRight, movefocus, r
bind = $mainMod+Shift, U, focusurgentorlast

# ── Move Windows ──────────────────────────────────────────────
bind = $mainMod+Shift, Left, movewindow, l
bind = $mainMod+Shift, Right, movewindow, r
bind = $mainMod+Shift, Up, movewindow, u
bind = $mainMod+Shift, Down, movewindow, d
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── Resize Windows ────────────────────────────────────────────
binde = $mainMod+Alt, Left, resizeactive, -20 0
binde = $mainMod+Alt, Right, resizeactive, 20 0
binde = $mainMod+Alt, Up, resizeactive, 0 -20
binde = $mainMod+Alt, Down, resizeactive, 0 20
binde = $mainMod+Alt+Shift, Left, resizeactive, -2 0
binde = $mainMod+Alt+Shift, Right, resizeactive, 2 0
binde = $mainMod+Alt+Shift, Up, resizeactive, 0 -2
binde = $mainMod+Alt+Shift, Down, resizeactive, 0 2

# ── Workspaces ────────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = Ctrl+$mainMod, Right, workspace, r+1
bind = Ctrl+$mainMod, Left, workspace, r-1
bind = Ctrl+$mainMod+Alt, Right, workspace, m+1
bind = Ctrl+$mainMod+Alt, Left, workspace, m-1
bind = $mainMod, Page_Down, workspace, r-1
bind = $mainMod, Page_Up, workspace, r+1
bind = Ctrl+$mainMod, Page_Down, workspace, r-5
bind = Ctrl+$mainMod, Page_Up, workspace, r+5
bind = $mainMod, mouse_up, workspace, r+1
bind = $mainMod, mouse_down, workspace, r-1

# ── Move to Workspace ─────────────────────────────────────────
bind = $mainMod+Alt, 1, movetoworkspacesilent, 1
bind = $mainMod+Alt, 2, movetoworkspacesilent, 2
bind = $mainMod+Alt, 3, movetoworkspacesilent, 3
bind = $mainMod+Alt, 4, movetoworkspacesilent, 4
bind = $mainMod+Alt, 5, movetoworkspacesilent, 5
bind = $mainMod+Alt, 6, movetoworkspacesilent, 6
bind = $mainMod+Alt, 7, movetoworkspacesilent, 7
bind = $mainMod+Alt, 8, movetoworkspacesilent, 8
bind = $mainMod+Alt, 9, movetoworkspacesilent, 9
bind = $mainMod+Alt, 0, movetoworkspacesilent, 10

bind = Ctrl+$mainMod+Shift, 1, movetoworkspace, 1
bind = Ctrl+$mainMod+Shift, 2, movetoworkspace, 2
bind = Ctrl+$mainMod+Shift, 3, movetoworkspace, 3
bind = Ctrl+$mainMod+Shift, 4, movetoworkspace, 4
bind = Ctrl+$mainMod+Shift, 5, movetoworkspace, 5
bind = Ctrl+$mainMod+Shift, 6, movetoworkspace, 6
bind = Ctrl+$mainMod+Shift, 7, movetoworkspace, 7
bind = Ctrl+$mainMod+Shift, 8, movetoworkspace, 8
bind = Ctrl+$mainMod+Shift, 9, movetoworkspace, 9
bind = Ctrl+$mainMod+Shift, 0, movetoworkspace, 10

bind = Ctrl+$mainMod+Shift, Right, movetoworkspace, r+1
bind = Ctrl+$mainMod+Shift, Left, movetoworkspace, r-1
bind = $mainMod+Shift, Page_Down, movetoworkspace, r-1
bind = $mainMod+Shift, Page_Up, movetoworkspace, r+1

# ── Special Workspace ─────────────────────────────────────────
bind = $mainMod, S, togglespecialworkspace
bind = $mainMod+Shift, S, movetoworkspace, special

# ── Overview ──────────────────────────────────────────────────
# bind = $mainMod, Tab, overview:toggle

# ── Navigation ────────────────────────────────────────────────
bind = Alt, Left, sendshortcut, , XF86Back, activewindow
bind = Alt, Right, sendshortcut, , XF86Forward, activewindow

# ── Zoom ──────────────────────────────────────────────────────
bind = Ctrl+$mainMod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
bind = Ctrl+$mainMod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
bind = Ctrl+$mainMod+Alt, 0, exec, hyprctl -q keyword cursor:zoom_factor 1

# ── Media Keys ────────────────────────────────────────────────
bindle = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind   = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind   = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind   = , XF86AudioPlay, exec, playerctl play-pause
bind   = , XF86AudioNext, exec, playerctl next
bind   = , XF86AudioPrev, exec, playerctl previous
bind   = , XF86AudioStop, exec, playerctl stop
bindle = , XF86MonBrightnessUp, exec, brightnessctl set '12.75+'
bindle = , XF86MonBrightnessDown, exec, brightnessctl set '12.75-'

# ── Screenshot ────────────────────────────────────────────────
bind = , Print, exec, hyprshot -m region --freeze --clipboard-only && paplay /usr/share/sounds/freedesktop/stereo/bell.oga --volume 32768
bind = Ctrl, Print, exec, hyprshot -m output --freeze --clipboard-only && paplay /usr/share/sounds/freedesktop/stereo/bell.oga --volume 32768
bind = $mainMod, Print, exec, hyprshot -m region --freeze -o ~/Pictures -f "screenshot-$(date +%Y%m%d-%H%M%S).png" && paplay /usr/share/sounds/freedesktop/stereo/bell.oga --volume 32768

# ══════════════════════════════════════════════════════════════
# ║  Window Rules                                              ║
# ══════════════════════════════════════════════════════════════

# Center all floating windows
windowrule = center on, match:float 1

# Picture in Picture
windowrule = float on, match:title (Picture in picture)
windowrule = pin on, match:title (Picture in picture)

# Kitty transparency
windowrule = opacity 0.8, match:class (kitty)
windowrule = opacity 0.9, match:class (kitty), match:focus 1

# System dialogs
windowrule = float on, match:class (blueman-manager)
windowrule = center on, match:class (blueman-manager)
windowrule = size 800 500, match:class (blueman-manager)
windowrule = float on, match:class (nm-connection-editor)
windowrule = float on, match:class (pavucontrol)
windowrule = float on, match:title (File Operation Progress)
windowrule = float on, match:title (Confirm to replace files)

# CopyQ
windowrule = float on, match:class (com.github.hluk.copyq)
windowrule = size 622 652, match:class (com.github.hluk.copyq)
windowrule = center on, match:class (com.github.hluk.copyq)

# Alt-tab switcher
windowrule = no_anim on, match:class (alttab)
windowrule = stay_focused on, match:class (alttab)
windowrule = workspace special:alttab, match:class (alttab)
windowrule = border_size 0, match:class (alttab)

# Gaming — bypass compositor effects for performance
windowrule = immediate on, match:class (gamescope)
windowrule = immediate on, match:class (steam_app_.*)
windowrule = no_blur on, match:class (gamescope)
windowrule = no_blur on, match:class (steam_app_.*)
windowrule = no_shadow on, match:class (gamescope)
windowrule = no_shadow on, match:class (steam_app_.*)
windowrule = fullscreen on, match:class (gamescope)
windowrule = no_anim on, match:class (steam_app_.*), match:fullscreen 1


# ══════════════════════════════════════════════════════════════
# ║  Alt-Tab                                                   ║
# ══════════════════════════════════════════════════════════════

# Tab/Shift+Tab cycle through windows while Alt is held
binde = ALT, Tab,       exec, ags request -i ionix-shell window-switcher next
binde = SHIFT+ALT, Tab, exec, ags request -i ionix-shell window-switcher prev

# Releasing Alt confirms and focuses the selected window
bindrt = ALT, Alt_L, exec, ags request -i ionix-shell window-switcher confirm
bindrt = ALT, Alt_L, submap, reset

submap = reset


# ══════════════════════════════════════════════════════════════
# ║  Autostart                                                 ║
# ══════════════════════════════════════════════════════════════

exec-once = awww-daemon &
exec-once = bash /etc/hypr/scripts/init.sh
exec-once = hyprpolkitagent
exec-once = hyprpanel
exec-once = blueman-applet
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11,ssh
exec-once = copyq
exec-once = foot --server
exec-once = nwg-dock-hyprland -d -hd 0
exec-once = ionix-first-login
