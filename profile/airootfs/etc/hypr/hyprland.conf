# ╔══════════════════════════════════════════════════════════════╗
# ║  Ionix - System Hyprland Configuration                     ║
# ║  /etc/hypr/hyprland.conf                                   ║
# ║                                                            ║
# ║  User overrides: ~/.config/hypr/hyprland.conf              ║
# ║  This file provides sensible defaults. Users source this   ║
# ║  file and add overrides in their own config.               ║
# ╚══════════════════════════════════════════════════════════════╝


# ── Monitors ──────────────────────────────────────────────────
# Auto-detect and use preferred resolution
monitor = ,preferred,auto,1


# ── Input ─────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}


# ── General ───────────────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(9b59b6) rgb(7c3aed) 45deg
    col.inactive_border = rgb(2d2d3f)
    layout = dwindle
    allow_tearing = false
}


# ── Decoration ────────────────────────────────────────────────
decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a2e88)
    }
}


# ── Animations ────────────────────────────────────────────────
animations {
    enabled = true

    bezier = ionixSmooth, 0.25, 0.1, 0.25, 1.0
    bezier = ionixSnap, 0.4, 0.0, 0.2, 1.0

    animation = windows, 1, 5, ionixSmooth
    animation = windowsOut, 1, 5, ionixSmooth, popin 80%
    animation = fade, 1, 4, ionixSmooth
    animation = workspaces, 1, 4, ionixSnap, slide
    animation = layers, 1, 3, ionixSmooth, fade
}


# ── Layouts ───────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
}


# ── Misc ──────────────────────────────────────────────────────
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    vrr = 1
}


# ── Environment ───────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland


# ══════════════════════════════════════════════════════════════
# ║  Key Bindings                                              ║
# ══════════════════════════════════════════════════════════════

$mainMod = SUPER

# ── Applications ──────────────────────────────────────────────
bind = $mainMod, Return, exec, kitty
bind = CTRL, T, exec, kitty
bind = $mainMod, B, exec, google-chrome-stable
bind = $mainMod, E, exec, nautilus

# ── Window Management ────────────────────────────────────────
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# ── Session ───────────────────────────────────────────────────
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, M, exit,

# ── Focus ─────────────────────────────────────────────────────
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# ── Move Windows ──────────────────────────────────────────────
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# ── Resize Windows ───────────────────────────────────────────
binde = $mainMod CTRL, left, resizeactive, -20 0
binde = $mainMod CTRL, right, resizeactive, 20 0
binde = $mainMod CTRL, up, resizeactive, 0 -20
binde = $mainMod CTRL, down, resizeactive, 0 20

# ── Workspaces ────────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ── Move to Workspace ────────────────────────────────────────
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ── Workspace Scroll ─────────────────────────────────────────
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ── Mouse Bindings ────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── Media Keys ────────────────────────────────────────────────
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binde = , XF86MonBrightnessUp, exec, brightnessctl s +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# ── Screenshot ────────────────────────────────────────────────
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy
bind = $mainMod, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png


# ══════════════════════════════════════════════════════════════
# ║  Window Rules                                              ║
# ══════════════════════════════════════════════════════════════

windowrulev2 = opacity 0.95, class:^(kitty)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, title:^(File Operation Progress)$
windowrulev2 = float, title:^(Confirm to replace files)$
windowrulev2 = center, class:^(blueman-manager)$
windowrulev2 = size 800 500, class:^(blueman-manager)$


# ══════════════════════════════════════════════════════════════
# ║  Autostart                                                 ║
# ══════════════════════════════════════════════════════════════

exec-once = hyprpaper
exec-once = hyprpolkitagent
exec-once = hyprpanel
exec-once = blueman-applet
exec-once = ionix-first-login
