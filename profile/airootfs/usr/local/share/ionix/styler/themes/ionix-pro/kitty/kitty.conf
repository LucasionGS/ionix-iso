# ionix-pro Kitty Configuration - Neon Cyber

# ── Font ──────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ── Window ────────────────────────────────────────────────────
window_padding_width 8
# Lower than base Ionix (0.92) to match the glassier bar. The hyprland side of this
# theme also sets a kitty window_rule opacity, and the two multiply.
background_opacity   0.80
confirm_os_window_close 0
hide_window_decorations yes

# ── Cursor ────────────────────────────────────────────────────
cursor_shape beam
cursor_blink_interval 0.5

# ── Scrollback ────────────────────────────────────────────────
scrollback_lines 10000

# ── Tab Bar ───────────────────────────────────────────────────
tab_bar_style       powerline
tab_powerline_style slanted
active_tab_foreground   #070312
active_tab_background   #b026ff
active_tab_font_style   bold
inactive_tab_foreground #e6d9ff
inactive_tab_background #0d0620

# ── Neon Cyber Color Scheme ──────────────────────────────────
foreground           #e6d9ff
background           #070312
selection_foreground #070312
selection_background #b026ff
cursor               #00f0ff
cursor_text_color    #070312
url_color            #ff2bd6

# Normal colors
color0  #0d0620
color1  #ff2b5e
color2  #00ff9f
color3  #ffb800
color4  #7c1fd4
color5  #b026ff
color6  #00f0ff
color7  #e6d9ff

# Bright colors
color8  #2a1350
color9  #ff5c85
color10 #5cffc4
color11 #ffd45c
color12 #a855f7
color13 #ff2bd6
color14 #5cf7ff
color15 #ffffff

# Maps
enabled_layouts splits
map ctrl+alt+shift+enter launch --location=hsplit
