# winix Kitty Configuration - Windows Terminal (Campbell)

# ── Font ──────────────────────────────────────────────────────
# Windows Terminal ships Cascadia Mono, which the ISO does not carry — and the
# prompt needs Nerd Font glyphs regardless, so stay on JetBrains Mono.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ── Window ────────────────────────────────────────────────────
window_padding_width 8
# Near-opaque: Windows Terminal is opaque out of the box. The hyprland side of this
# theme also sets a kitty window_rule opacity, and the two multiply.
background_opacity   0.94
confirm_os_window_close 0
hide_window_decorations yes

# ── Cursor ────────────────────────────────────────────────────
# Block, not the beam the other Ionix themes use — that is the console default.
cursor_shape block
cursor_blink_interval 0.5

# ── Scrollback ────────────────────────────────────────────────
scrollback_lines 10000

# ── Tab Bar ───────────────────────────────────────────────────
# Rounded powerline is the closest kitty gets to a Windows Terminal tab.
tab_bar_style       powerline
tab_powerline_style round
active_tab_foreground   #ffffff
active_tab_background   #0078d4
active_tab_font_style   bold
inactive_tab_foreground #cccccc
inactive_tab_background #1b1b1b

# ── Campbell Color Scheme ────────────────────────────────────
# Windows Terminal's stock palette, verbatim.
foreground           #cccccc
background           #0c0c0c
selection_foreground #ffffff
selection_background #0078d4
cursor               #ffffff
cursor_text_color    #0c0c0c
url_color            #4cc2ff

# Normal colors
color0  #0c0c0c
color1  #c50f1f
color2  #13a10e
color3  #c19c00
color4  #0037da
color5  #881798
color6  #3a96dd
color7  #cccccc

# Bright colors
color8  #767676
color9  #e74856
color10 #16c60c
color11 #f9f1a5
color12 #3b78ff
color13 #b4009e
color14 #61d6d6
color15 #f2f2f2

# Maps
enabled_layouts splits
map ctrl+alt+shift+enter launch --location=hsplit
