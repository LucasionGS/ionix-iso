# Ionix Kitty Configuration - Purple/Violet Dark Theme

# ── Font ──────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ── Window ────────────────────────────────────────────────────
window_padding_width 8
background_opacity   0.92
confirm_os_window_close 0
hide_window_decorations yes

# ── Cursor ────────────────────────────────────────────────────
cursor_shape beam
cursor_blink_interval 0.5

# ── Scrollback ────────────────────────────────────────────────
scrollback_lines 10000

# ── Tab Bar ───────────────────────────────────────────────────
tab_bar_style       powerline
tab_powerline_style slanted
active_tab_foreground   #0f0a18
active_tab_background   #9b59b6
active_tab_font_style   bold
inactive_tab_foreground #c4b5fd
inactive_tab_background #1a1025

# ── Purple/Violet Dark Color Scheme ──────────────────────────
foreground           #e2d9f3
background           #0f0a18
selection_foreground #0f0a18
selection_background #9b59b6
cursor               #9b59b6
cursor_text_color    #0f0a18
url_color            #a855f7

# Normal colors
color0  #1a1025
color1  #e74c3c
color2  #2ecc71
color3  #f39c12
color4  #7c3aed
color5  #9b59b6
color6  #1abc9c
color7  #c4b5fd

# Bright colors
color8  #2d2d3f
color9  #ff6b6b
color10 #55efc4
color11 #feca57
color12 #a855f7
color13 #c084fc
color14 #48dbfb
color15 #e2d9f3

# Maps
enabled_layouts splits
map ctrl+alt+shift+enter launch --location=hsplit
