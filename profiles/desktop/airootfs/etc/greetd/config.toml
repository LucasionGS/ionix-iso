# greetd, for `ionix-login-mode greeter`. The greeter is ionix-greeter (the lock
# screen with a username field) in cage, a compositor that shows one fullscreen
# app and nothing else. `-s` lets it switch VTs, which greetd needs to hand the
# screen to the session.
[terminal]
vt = 1

[default_session]
command = "cage -s -- ionix-greeter"
user = "greeter"
