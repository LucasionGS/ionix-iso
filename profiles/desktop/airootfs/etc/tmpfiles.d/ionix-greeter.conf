# ionix-greeter: last-user lives here (written by the greeter account); users/ is
# where ionix-greeter-sync leaves each user's theme and wallpaper for the greeter
# to read. Sticky and world-writable, so every user writes only their own entry.
d /var/lib/ionix-greeter        0755 greeter greeter -
d /var/lib/ionix-greeter/users  1777 root    root    -
