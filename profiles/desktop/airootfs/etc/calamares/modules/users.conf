---
defaultGroups:
  - name: wheel
    must_exist: true
    system: true
  - name: video
    must_exist: false
    system: true
  - name: audio
    must_exist: false
    system: true
  - name: network
    must_exist: false
    system: true
  - name: storage
    must_exist: false
    system: true
  - name: input
    must_exist: false
    system: true

autologinGroup: autologin
# Show "Log in automatically without asking for the password", unticked. Ionix
# always autologins on tty1 and opens the session behind the lock screen, so the
# lock screen is the password prompt; ticking this skips that lock instead
# (ionix-post-install reads it as ionixAutologin, mirrored by the Personalize page).
displayAutologin: true
doAutologin: false

sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: true
doReusePassword: true

passwordRequirements:
    minLength: 1
    maxLength: -1

allowWeakPasswords: true
allowWeakPasswordsDefault: false

userShell: /usr/bin/fish
