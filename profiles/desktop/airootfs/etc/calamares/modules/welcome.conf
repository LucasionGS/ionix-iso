---
# Links on the welcome page come from branding.desc's strings (productUrl etc.).
showSupportUrl:      true
showKnownIssuesUrl:  true
showReleaseNotesUrl: false
showDonateUrl:       false

requirements:
    # A full install with every optional bundle lands around 14 GB, so 20 GB
    # leaves room for a first round of updates.
    requiredStorage: 20
    requiredRam:     2.0
    # Only reachability matters here, and the optional-software step uses the
    # same host to decide whether it can download anything.
    internetCheckUrl: https://archlinux.org

    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    # Internet is recommended, not required: the base system installs from the
    # medium, and only the optional software needs the network.
    required:
        - storage
        - ram
        - root
