# Which portal backend answers what under Hyprland. Overrides the copy
# xdg-desktop-portal-hyprland ships in /usr/share, which says only
# `default=hyprland;gtk`.
#
# File open/save dialogs go to ioexplorer-portal (D-Bus activated, so it has
# no service to enable). Its .portal file still names Hyprland with the old
# `UseIn=` key, which xdg-desktop-portal no longer reads — without this line it
# is never chosen. gtk stays listed after it as the fallback backend.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=ioexplorer;gtk
