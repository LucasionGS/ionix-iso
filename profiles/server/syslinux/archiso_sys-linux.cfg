LABEL ionix
TEXT HELP
Boot the Ionix Server live medium on BIOS.
It allows you to install Ionix Server or perform system maintenance.
ENDTEXT
MENU LABEL Ionix Server Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y

# The kernel and every login prompt on ttyS0 too, for IPMI serial-over-LAN and
# other headless consoles. The last console= is /dev/console, so tty0 keeps
# the boot messages when a screen is attached.
LABEL ionixserial
TEXT HELP
Boot the Ionix Server live medium on BIOS, with a serial console on ttyS0.
ENDTEXT
MENU LABEL Ionix Server Live (%ARCH%, BIOS) on ^serial console
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y console=ttyS0,115200 console=tty0
