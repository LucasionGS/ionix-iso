# Ionix Server console. kmscon draws every VT (kmsconvt@ttyN, which the
# installer enables in place of getty) with the terminals' own font, so a screen
# plugged into the server looks like the terminal you would SSH in from. If
# kmscon cannot start, systemd falls back to a plain getty. Options: man kmscon.conf
font-name=JetBrainsMono Nerd Font
# Every remote host knows xterm-256color; few have kmscon's own terminfo.
term=xterm-256color
# Blank the screen after ten idle minutes; any key wakes it.
dpms-timeout=600
# >>> ionix palette (managed by ionix-console-theme; edits in here are replaced)
palette=custom
palette-black=26,16,37
palette-red=231,76,60
palette-green=46,204,113
palette-yellow=243,156,18
palette-blue=124,58,237
palette-magenta=155,89,182
palette-cyan=26,188,156
palette-light-grey=196,181,253
palette-dark-grey=45,45,63
palette-light-red=255,107,107
palette-light-green=85,239,196
palette-light-yellow=254,202,87
palette-light-blue=168,85,247
palette-light-magenta=192,132,252
palette-light-cyan=72,219,251
