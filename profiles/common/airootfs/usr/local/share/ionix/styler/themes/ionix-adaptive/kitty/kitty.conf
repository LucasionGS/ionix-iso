# Ionix Adaptive — kitty — static fallback
#
# GENERATED from ../adaptive/kitty/kitty.conf with the base Ionix palette. This
# is what gets installed when there is no wallpaper to read, no matugen, or a
# template that failed to render — never edit it directly, edit the template and
# re-render, or the two will drift and the fallback will stop being a faithful
# preview of what the theme looks like.

# ── Font ──────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ── Window ────────────────────────────────────────────────────
window_padding_width 8
background_opacity   0.92
# Without this kitty ignores a changed background_opacity on the SIGUSR1 reload
# the styler sends, so an already-open terminal would keep the old translucency.
dynamic_background_opacity yes
confirm_os_window_close 0
hide_window_decorations yes

# ── Cursor ────────────────────────────────────────────────────
cursor_shape beam
cursor_blink_interval 0.5

# ── Scrollback ────────────────────────────────────────────────
scrollback_lines 10000

# ── Tab Bar ───────────────────────────────────────────────────
tab_bar_style       powerline
tab_powerline_style slanted
active_tab_foreground   #0f0a18
active_tab_background   #9b59b6
active_tab_font_style   bold
inactive_tab_foreground #c4b5fd
inactive_tab_background #1a1025

# ── Wallpaper-derived colour scheme ───────────────────────────
foreground           #e2d9f3
background           #0f0a18
selection_foreground #0f0a18
selection_background #9b59b6
cursor               #9b59b6
cursor_text_color    #0f0a18
url_color            #a855f7

# Normal colors
# 0, 7, 8 and 15 are structural — background, foreground and their dim/bright
# neighbours — so they follow the wallpaper. The hues in between do not, unless
# IONIX_ADAPTIVE_ANSI=tinted: red has to stay red for everything that draws in
# this terminal.
color0  #1a1025
color1  #e74c3c
color2  #2ecc71
color3  #f39c12
color4  #7c3aed
color5  #9b59b6
color6  #1abc9c
color7  #c4b5fd

# Bright colors
color8  #2d2d3f
color9  #ff6b6b
color10 #55efc4
color11 #feca57
color12 #a855f7
color13 #c084fc
color14 #48dbfb
color15 #e2d9f3

# Maps
enabled_layouts splits
map ctrl+alt+shift+enter launch --location=hsplit
