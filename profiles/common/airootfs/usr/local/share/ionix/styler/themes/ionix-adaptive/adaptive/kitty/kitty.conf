# Ionix Adaptive — kitty
#
# Template. ionix-adaptive-colors renders this against the current wallpaper and
# writes ~/.config/ionix/adaptive-colors/kitty/kitty.conf; the file beside this
# one at ../../kitty/kitty.conf is the same thing with the Ionix palette baked
# in, used whenever a wallpaper cannot be read.

# ── Font ──────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ── Window ────────────────────────────────────────────────────
window_padding_width 8
background_opacity   0.92
# Without this kitty ignores a changed background_opacity on the SIGUSR1 reload
# the styler sends, so an already-open terminal would keep the old translucency.
dynamic_background_opacity yes
confirm_os_window_close 0
hide_window_decorations yes

# ── Cursor ────────────────────────────────────────────────────
cursor_shape beam
cursor_blink_interval 0.5

# ── Scrollback ────────────────────────────────────────────────
scrollback_lines 10000

# ── Tab Bar ───────────────────────────────────────────────────
tab_bar_style       powerline
tab_powerline_style slanted
active_tab_foreground   {{bgDeep}}
active_tab_background   {{accent}}
active_tab_font_style   bold
inactive_tab_foreground {{text}}
inactive_tab_background {{bgWindow}}

# ── Wallpaper-derived colour scheme ───────────────────────────
foreground           {{textBright}}
background           {{bgDeep}}
selection_foreground {{bgDeep}}
selection_background {{accent}}
cursor               {{accent}}
cursor_text_color    {{bgDeep}}
url_color            {{accentBright}}

# Normal colors
# 0, 7, 8 and 15 are structural — background, foreground and their dim/bright
# neighbours — so they follow the wallpaper. The hues in between do not, unless
# IONIX_ADAPTIVE_ANSI=tinted: red has to stay red for everything that draws in
# this terminal.
color0  {{ansi0}}
color1  {{ansi1}}
color2  {{ansi2}}
color3  {{ansi3}}
color4  {{ansi4}}
color5  {{ansi5}}
color6  {{ansi6}}
color7  {{ansi7}}

# Bright colors
color8  {{ansi8}}
color9  {{ansi9}}
color10 {{ansi10}}
color11 {{ansi11}}
color12 {{ansi12}}
color13 {{ansi13}}
color14 {{ansi14}}
color15 {{ansi15}}

# Maps
enabled_layouts splits
map ctrl+alt+shift+enter launch --location=hsplit
