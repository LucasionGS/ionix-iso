# Ionix console palette for kmscon. ionix-console-theme copies these lines into
# /etc/kmscon/kmscon.conf; nothing else from this file is used.
palette=custom
palette-black={{ansi0.rgb}}
palette-red={{ansi1.rgb}}
palette-green={{ansi2.rgb}}
palette-yellow={{ansi3.rgb}}
palette-blue={{ansi4.rgb}}
palette-magenta={{ansi5.rgb}}
palette-cyan={{ansi6.rgb}}
palette-light-grey={{ansi7.rgb}}
palette-dark-grey={{ansi8.rgb}}
palette-light-red={{ansi9.rgb}}
palette-light-green={{ansi10.rgb}}
palette-light-yellow={{ansi11.rgb}}
palette-light-blue={{ansi12.rgb}}
palette-light-magenta={{ansi13.rgb}}
palette-light-cyan={{ansi14.rgb}}
palette-white={{ansi15.rgb}}
palette-foreground={{textBright.rgb}}
palette-background={{bgDeep.rgb}}
