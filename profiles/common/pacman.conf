#
# Ionix pacman.conf
# Used during ISO build by mkarchiso
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5
Color

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Ionix local repository (AUR packages built during ISO build)
# The Server path is patched by build.sh before mkarchiso runs
[ionix]
SigLevel = Optional TrustAll
Server = file:///tmp/ionix-localrepo
