# dockix Kitty Configuration

# ── Font ──────────────────────────────────────────────────────
# The prompt needs Nerd Font glyphs, so the terminal stays on JetBrains Mono.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ── Window ────────────────────────────────────────────────────
window_padding_width 8
# The hyprland side of this theme sets no opacity rule of its own for terminals.
background_opacity   0.94
confirm_os_window_close 0
hide_window_decorations yes

# ── Cursor ────────────────────────────────────────────────────
cursor_shape block
cursor_blink_interval 0.5

# ── Scrollback ────────────────────────────────────────────────
scrollback_lines 10000

# ── Tab Bar ───────────────────────────────────────────────────
tab_bar_style       powerline
tab_powerline_style round
active_tab_foreground   #ffffff
active_tab_background   #0a84ff
active_tab_font_style   bold
inactive_tab_foreground #e5e5ea
inactive_tab_background #1c1c1e

# ── Color Scheme ──────────────────────────────────────────────
foreground           #e5e5ea
background           #1e1e1e
selection_foreground #ffffff
selection_background #0a84ff
cursor               #ffffff
cursor_text_color    #1e1e1e
url_color            #64a8ff

# Normal colors
color0  #1e1e1e
color1  #ff453a
color2  #30d158
color3  #ffd60a
color4  #0a84ff
color5  #bf5af2
color6  #64d2ff
color7  #e5e5ea

# Bright colors
color8  #6e6e73
color9  #ff453a
color10 #30d158
color11 #ffe066
color12 #409cff
color13 #da8fff
color14 #70d7ff
color15 #ffffff

# Maps
enabled_layouts splits
map ctrl+alt+shift+enter launch --location=hsplit
