# Ionix gaming kernel tweaks (inspired by SteamOS)

# Required by many Proton/Wine games. Steam warns if this is too low.
# SteamOS default: 2147483642
vm.max_map_count = 2147483642

# Disable split-lock mitigation — older games trigger this and get
# forcibly serialized by the kernel, causing massive frame drops.
kernel.split_lock_mitigate = 0

# Reduce memory compaction stalls during gameplay
vm.compaction_proactiveness = 0

# Shorter page lock unfairness window — reduces stutter from page faults
vm.page_lock_unfairness = 1

# Disable NMI watchdog — saves a small but constant CPU cost.
# Not needed on desktop/gaming systems.
kernel.nmi_watchdog = 0

# Larger UDP receive buffers for online gaming (reduces packet loss)
net.core.rmem_default = 1048576
net.core.rmem_max = 16777216
net.core.wmem_default = 1048576
net.core.wmem_max = 16777216
